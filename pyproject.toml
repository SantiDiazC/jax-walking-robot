[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-walking-robot"
version = "0.1.0"
description = "JAX port of MATLAB dynamics for a planar piezoelectric walking robot"
requires-python = ">=3.10"
dependencies = ["jax>=0.4.30,<0.9", "numpy>=1.24", "PyYAML>=6.0"]

[project.optional-dependencies]
examples = ["matplotlib>=3.7"]
analysis = ["scipy>=1.10", "matplotlib>=3.7"]
test = ["pytest>=7", "scipy>=1.10"]
learning = ["torch>=2.9"]
notebooks = ["jupyterlab>=4", "ipykernel>=6", "matplotlib>=3.7", "ipywidgets>=8,<9",
             "nbclient>=0.10", "nbformat>=5.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
